baseURL = "https://hibiscus.com.br/"
locale = "pt-BR"
defaultContentLanguage = "pt-br"
# false = o português fica na raiz (/contato/, não /pt-br/contato/).
# Não mudar: alterar as URLs em pt jogaria fora o SEO já acumulado.
defaultContentLanguageInSubdir = false
# pt-br, es e en ativos. Para desligar um idioma sem apagar o conteúdo:
# disableLanguages = ["en"]
title = "Hibiscus Phytocosméticos"
enableRobotsTXT = false
# Desligado de propósito. O <lastmod> do sitemap vem do front matter, não do
# git — ver [frontmatter] abaixo e a seção "lastmod" no README.
#
# O git só daria a data certa num clone completo, e o build do Cloudflare Pages
# sempre clona raso. Com histórico de um commit só, o Hugo carimba TODAS as
# páginas com a mesma data, que muda a cada deploy — para o Google isso é o
# mesmo que não informar nada. O build passa sem erro nos dois casos.
enableGitInfo = false
# RSS desabilitado: o site não tem conteúdo cronológico, e o feed saía com
# pubDate no ano 0001. Nada linkava para ele.
disableKinds = ["taxonomy", "term", "RSS"]

# Ordem de resolução do lastmod. O padrão do Hugo é [':git', 'lastmod', ...] —
# aqui o front matter vem primeiro, então a data é a que está escrita no
# arquivo. Determinístico, e independe da profundidade do clone.
#
# ⚠️ Toda página em content/ precisa de `lastmod:` no front matter. Sem ele a
# resolução cai em :fileModTime, que no Cloudflare é a hora do checkout —
# idêntica para todos os arquivos, exatamente o problema que isto resolve.
#
# ⚠️ [frontmatter] é uma tabela TOML: qualquer chave de topo escrita depois
# dela passaria a pertencer a frontmatter em vez da config raiz. Chaves novas
# de topo vão ACIMA desta linha. (Mesma armadilha de [params.postal].)
[frontmatter]
  lastmod = ["lastmod", ":fileModTime", ":default"]

[params]
  description = "Desenvolvemos e fabricamos cosméticos personalizados para a sua marca. Private label em São Bernardo do Campo."
  ogImage = "/img/og.jpg"
  whatsappPhone = "5511976591889"
  # O texto padrão do WhatsApp é traduzido: i18n/*.toml, chave whatsapp_default.
  phone = "1143907736"
  phoneDisplay = "(11) 4390-7736"
  whatsappDisplay = "(11) 97659-1889"
  hours = "Seg a Sex de 7h às 17h"
  cnpj = "03.654.997/0001-91"
  foundingDate = "2000"
  rhEmail = "rh@hibiscus.com.br"
  contatoEmail = "contato@hibiscus.com.br"
  # Set to a real URL when/if a corporate Instagram is created.
  # Empty = footer hides the social block and JSON-LD omits sameAs.
  instagram = ""
  facebook = ""
  # Search engine verification — paste the content="..." value from each console.
  # Leave empty to omit the meta tag entirely.
  googleSiteVerification = ""
  bingSiteVerification = ""

  # Metadados social/JSON-LD. Ficam aqui (e não em i18n/) porque acompanham
  # `description` e porque knowsAbout é uma lista — i18n só guarda strings.
  # Estes são os valores pt-br; es e en sobrescrevem em [languages.X.params].
  ogImageAlt = "Hibiscus Phytocosméticos — fabricante private label de cosméticos em São Bernardo do Campo"
  schemaDescription = "Fabricante private label de cosméticos em São Bernardo do Campo. Desenvolvimento e fabricação de cosméticos personalizados, com sigilo absoluto, regulação completa e mentoria estratégica. Em operação desde 2000."
  schemaAreaServed = "Brasil"
  schemaServiceName = "Fabricação private label de cosméticos"
  # Tooltip do seletor de idioma quando a página não existe neste idioma e o
  # link cai na home. Fica no idioma de DESTINO — quem clica em "PT" lê pt.
  langHomeFallback = "Esta página não existe em português — ir para a página inicial"
  schemaKnowsAbout = [
    "Fabricação de cosméticos",
    "Private label",
    "Linha facial",
    "Linha corporal",
    "Maquiagem",
    "Registro Anvisa",
    "Mentoria de marca",
    "Clean beauty",
    "Cosméticos veganos",
  ]

  # Fonte única do endereço. Texto visível: partials/address-line.html.
  # PostalAddress do JSON-LD: partials/schema-address.html.
  # Bairro conforme registro dos Correios para o CEP 09895-510.
  # NOTA TOML: esta tabela precisa ficar no fim de [params] — qualquer chave
  # escrita depois dela passaria a pertencer a params.postal.
  [params.postal]
    street = "Rua Max Mangels Senior, 347"
    district = "Planalto"
    city = "São Bernardo do Campo"
    region = "SP"
    postalCode = "09895-510"
    country = "BR"
    latitude = "-23.7080"
    longitude = "-46.5634"

# ----------------------------------------------------------------
# Idiomas
# ----------------------------------------------------------------
# pt-br é o idioma padrão e fica na raiz; es e en ficam em /es/ e /en/.
# Traduções são por arquivo: content/pagina.es.md, content/pagina.en.md.
#
# Traduzidas hoje: home, quem-somos, o-que-fazemos, modelos-de-desenvolvimento,
# regularizacao-anvisa-cosmeticos, terceirizacao-para-industrias e contato.
# Só em português: politica-de-privacidade. Páginas comuns sem tradução não
# existem no idioma — sem fallback, que é o desejado.
#
# EXCEÇÃO: home e 404 são SEMPRE gerados para todo idioma ativo, mesmo sem
# conteúdo. Ativar um idioma sem o _index.<lang>.md publica a home com o hero
# vazio, e o build passa sem erro. Crie o _index.<lang>.md primeiro.
[languages]
  [languages.pt-br]
    locale = "pt-BR"
    label = "Português"
    direction = "ltr"
    weight = 1
    # Sub-tabela por último: qualquer chave abaixo dela pertenceria a .params.
    [languages.pt-br.params]
      labelShort = "PT"
      # og:locale exige language_TERRITORY — é o único lugar que pede território.
      # hreflang e <html lang> continuam neutros (es/en), ver README, "hreflang".
      # Definido nos três idiomas (e não só no [params] raiz) porque o partial
      # lê .Language.Params.ogLocale das OUTRAS línguas para og:locale:alternate.
      ogLocale = "pt_BR"
  [languages.es]
    locale = "es"
    label = "Español"
