name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HUGO_VERSION: 0.166.0
      HUGO_SHA256: 0e39b901e3f919f1daae05c8ff64f0c14c8a348ef46886d63f8e6d1bb2653885
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Hugo Extended
        run: |
          archive="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl --fail --location --retry 3 \
            --output "/tmp/${archive}" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/${archive}"
          echo "${HUGO_SHA256}  /tmp/${archive}" | sha256sum --check
          tar --extract --gzip --file "/tmp/${archive}" --directory /tmp hugo
          sudo install /tmp/hugo /usr/local/bin/hugo
          hugo version

      - name: Verify Hugo version
        run: python3 scripts/check-hugo-version.py

      - name: Build production site
        run: hugo --panicOnWarning --minify

      - name: Test audit properties
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Audit generated site
        run: python3 scripts/audit-build.py
