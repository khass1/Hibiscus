<header class="site-header" data-header>
  <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
  <div class="container header-inner">
    <a class="brand" href="/" aria-label="Hibiscus Phytocosméticos, página inicial">
      <span class="brand-wordmark">Hibiscus<span class="brand-dot">.</span></span>
      <span class="brand-sub">Phytocosméticos</span>
    </a>

    <button class="nav-toggle" data-nav-toggle aria-expanded="false" aria-controls="primary-nav" aria-label="Abrir menu">
      <span></span><span></span><span></span>
    </button>

    <nav class="primary-nav" id="primary-nav" aria-label="Principal">
      <ul>
        {{ range site.Menus.main }}
          <li><a href="{{ .URL }}"{{ if $.IsMenuCurrent "main" . }} aria-current="page"{{ end }}>{{ .Name }}</a></li>
        {{ end }}
      </ul>
      <a class="nav-cta" href="{{ partial "whatsapp-url.html" "" }}" rel="noopener">
        Fale conosco
      </a>
    </nav>
  </div>
  {{- /* Sem JS o botão não faz nada e a navegação ficaria inalcançável no
         mobile. Aqui ela vira uma lista estática dentro do header. */ -}}
  <noscript>
    <style>
      @media (max-width: 880px) {
        .nav-toggle { display: none; }
        .header-inner { flex-wrap: wrap; height: auto; padding-block: 1rem; gap: 1rem; }
        .primary-nav {
          position: static;
          height: auto;
          width: 100%;
          transform: none;
          opacity: 1;
          visibility: visible;
          pointer-events: auto;
          padding: 0 0 0.5rem;
          border-top: 0;
          overflow: visible;
        }
        .primary-nav ul { flex-direction: row; flex-wrap: wrap; gap: 0.25rem 1.25rem; }
        .primary-nav a { font-size: 1rem; font-family: var(--body); }
        .primary-nav a.nav-cta { align-self: flex-start; padding: 0.7rem 1.3rem; font-size: 0.95rem; margin-top: 0; }
      }
    </style>
  </noscript>
</header>
<script>
  (function(){
    var btn = document.querySelector('[data-nav-toggle]');
    var nav = document.getElementById('primary-nav');
    if(!btn || !nav) return;

    // O menu mobile cobre a tela inteira: o resto do documento vira inert
    // enquanto ele está aberto, para leitor de tela e para o foco.
    // Resolvido sob demanda: este script roda dentro do <header>, antes de
    // <main> e do footer existirem no DOM.
    var outside = null;
    function outsideEls(){
      if(!outside){
        outside = [
          document.getElementById('conteudo'),
          document.querySelector('.site-footer'),
          document.querySelector('.wa-fab')
        ].filter(Boolean);
      }
      return outside;
    }

    function isOpen(){ return btn.getAttribute('aria-expanded') === 'true'; }

    function setOpen(open){
      btn.setAttribute('aria-expanded', String(open));
      btn.setAttribute('aria-label', open ? 'Fechar menu' : 'Abrir menu');
      nav.classList.toggle('is-open', open);
      document.body.classList.toggle('nav-open', open);
      outsideEls().forEach(function(el){
        if(open){ el.setAttribute('inert', ''); }
        else { el.removeAttribute('inert'); }
      });
    }

    btn.addEventListener('click', function(){
      var next = !isOpen();
      setOpen(next);
      if(next){
        var first = nav.querySelector('a[href]');
        if(first) first.focus();
      }
    });

    document.addEventListener('keydown', function(e){
      if(!isOpen()) return;

      if(e.key === 'Escape'){
        setOpen(false);
        btn.focus();
        return;
      }

      if(e.key !== 'Tab') return;
      // O botão fica fora do <nav>, mas faz parte do ciclo — é o "fechar".
      var items = [btn].concat(
        Array.prototype.slice.call(nav.querySelectorAll('a[href]'))
      );
      var first = items[0];
      var last = items[items.length - 1];
      if(e.shiftKey && document.activeElement === first){
        e.preventDefault(); last.focus();
      } else if(!e.shiftKey && document.activeElement === last){
        e.preventDefault(); first.focus();
      }
    });

    // Seguir um link fecha o menu — âncoras na mesma página não recarregam.
    nav.addEventListener('click', function(e){
      if(e.target.closest('a')) setOpen(false);
    });

    // Passar para o desktop com o menu aberto deixaria body travado e inert.
    var mq = window.matchMedia('(min-width: 881px)');
    var onWide = function(e){ if(e.matches && isOpen()) setOpen(false); };
    if(mq.addEventListener) mq.addEventListener('change', onWide);
    else if(mq.addListener) mq.addListener(onWide);
  })();
</script>
