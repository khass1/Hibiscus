{{ define "main" }}
<section class="page-header">
  <div class="container">
    <p class="eyebrow">{{ site.Title }}</p>
    <h1>{{ .Title }}</h1>
    {{ with .Params.lede }}<p class="page-lede">{{ . | markdownify }}</p>{{ end }}
  </div>
</section>
<section class="page-body">
  <div class="container prose">
    {{ .Content }}
  </div>
</section>
{{ with .Params.cta }}
<section class="cta-band">
  <div class="container cta-band-inner">
    <div>
      <h2>{{ .title }}</h2>
      {{ with .text }}<p>{{ . }}</p>{{ end }}
    </div>
    <a class="btn btn-primary" href="{{ partial "whatsapp-url.html" .whatsapp }}" rel="noopener">{{ .label }}</a>
  </div>
</section>
{{ end }}
{{ end }}
