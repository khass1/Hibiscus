baseURL = "https://hibiscus.com.br/"
locale = "pt-BR"
defaultContentLanguage = "pt-br"
# false = o português fica na raiz (/contato/, não /pt-br/contato/).
# Não mudar: alterar as URLs em pt jogaria fora o SEO já acumulado.
defaultContentLanguageInSubdir = false
# pt-br, es e en ativos. Para desligar um idioma sem apagar o conteúdo:
# disableLanguages = ["en"]
title = "Hibiscus Phytocosméticos"
enableRobotsTXT = false
# Alimenta o <lastmod> do sitemap com a data do último commit de cada página.
# Exige histórico git no build — ver nota sobre clone depth no README.
enableGitInfo = true
# RSS desabilitado: o site não tem conteúdo cronológico, e o feed saía com
# pubDate no ano 0001. Nada linkava para ele.
disableKinds = ["taxonomy", "term", "RSS"]

[params]
  description = "Desenvolvemos e fabricamos cosméticos personalizados para a sua marca. Private label em São Bernardo do Campo."
  ogImage = "/img/og.jpg"
  whatsappPhone = "5511976591889"
  whatsappTextDefault = "Olá! Visitei o site da Hibiscus e gostaria de conversar sobre um projeto."
  phone = "1143907736"
  phoneDisplay = "(11) 4390-7736"
  whatsappDisplay = "(11) 97659-1889"
  hours = "Seg a Sex de 7h às 17h"
  cnpj = "03.654.997/0001-91"
  foundingDate = "2000"
  rhEmail = "rh@hibiscus.com.br"
  contatoEmail = "contato@hibiscus.com.br"
  # Set to a real URL when/if a corporate Instagram is created.
  # Empty = footer hides the social block and JSON-LD omits sameAs.
  instagram = ""
  facebook = ""
  # Search engine verification — paste the content="..." value from each console.
  # Leave empty to omit the meta tag entirely.
  googleSiteVerification = ""
  bingSiteVerification = ""

  # Fonte única do endereço. Texto visível: partials/address-line.html.
  # PostalAddress do JSON-LD: partials/schema-address.html.
  # Bairro conforme registro dos Correios para o CEP 09895-510.
  # NOTA TOML: esta tabela precisa ficar no fim de [params] — qualquer chave
  # escrita depois dela passaria a pertencer a params.postal.
  [params.postal]
    street = "Rua Max Mangels Senior, 347"
    district = "Planalto"
    city = "São Bernardo do Campo"
    region = "SP"
    postalCode = "09895-510"
    country = "BR"
    latitude = "-23.7080"
    longitude = "-46.5634"

# ----------------------------------------------------------------
# Idiomas
# ----------------------------------------------------------------
# pt-br é o idioma padrão e fica na raiz; es e en ficam em /es/ e /en/.
# Traduções são por arquivo: content/pagina.es.md, content/pagina.en.md.
#
# Traduzidas hoje: home, quem-somos, o-que-fazemos e contato.
# Só em português: modelos-de-desenvolvimento, terceirizacao-para-industrias,
# regularizacao-anvisa-cosmeticos e politica-de-privacidade. Páginas comuns
# sem tradução não existem no idioma — sem fallback, que é o desejado.
#
# EXCEÇÃO: home e 404 são SEMPRE gerados para todo idioma ativo, mesmo sem
# conteúdo. Ativar um idioma sem o _index.<lang>.md publica a home com o hero
# vazio, e o build passa sem erro. Crie o _index.<lang>.md primeiro.
[languages]
  [languages.pt-br]
    locale = "pt-BR"
    label = "Português"
    direction = "ltr"
    weight = 1
    # Sub-tabela por último: qualquer chave abaixo dela pertenceria a .params.
    [languages.pt-br.params]
      labelShort = "PT"
  [languages.es]
    locale = "es"
    label = "Español"
    direction = "ltr"
    weight = 2
    title = "Hibiscus Phytocosméticos"
    [languages.es.params]
      labelShort = "ES"
      description = "Fabricamos cosméticos personalizados para su marca. Private label en São Bernardo do Campo, Brasil."
      hours = "Lun a Vie de 7 a 17 h (BRT)"
    [languages.es.menus]
